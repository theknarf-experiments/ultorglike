[package]
name = "query-engine"
version = "0.1.0"
edition = "2021"
description = "PostgreSQL, SQLite and DuckDB nested relational query execution"

[dependencies]
postgres = { version = "0.19", features = ["with-serde_json-1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
data-model = { path = "../data-model" }
thiserror = "2"
native-tls = "0.2"
postgres-native-tls = "0.5"
rusqlite = { version = "0.40.1", features = ["bundled"] }
duckdb = { version = "1.10505.0", features = ["bundled"] }
