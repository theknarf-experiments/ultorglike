name: Rust and database workflow
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format, unit tests, lint, and three-backend integration
        run: ./scripts/check.sh --postgres
      - name: Verify TLS trust and hostnames
        run: ./scripts/check-tls.sh
      - name: Keyboard and terminal acceptance workflow
        run: |
          cargo build --locked
          cargo build -p query-engine --example seed --locked
          python3 -m venv .venv
          .venv/bin/pip install -r dev/requirements-test.txt
          .venv/bin/python scripts/smoke.py
          .venv/bin/python scripts/smoke-embedded.py
      - name: Database logs on failure
        if: failure()
        run: docker compose logs postgres
      - name: Stop test services
        if: always()
        run: docker compose down
