services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ultorg
      POSTGRES_PASSWORD: ultorg
      POSTGRES_DB: ultorg
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./dev/seed.sql:/docker-entrypoint-initdb.d/001-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ultorg -d ultorg && psql -U ultorg -d ultorg -tAc 'SELECT count(*) FROM public.line_items' >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres-data:
